<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>JARVIS Mobile</title>
    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <header class="mobile-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-brain pulse"></i>
                    <span>JARVIS</span>
                </div>
                <div class="connection-status" id="connection-status">
                    <i class="fas fa-circle"></i>
                </div>
            </div>
        </header>

        <!-- Main Voice Interface -->
        <div class="voice-interface">
            <div class="voice-circle-container">
                <div class="voice-circle" id="voice-circle">
                    <div class="voice-ring ring-1"></div>
                    <div class="voice-ring ring-2"></div>
                    <div class="voice-ring ring-3"></div>
                    <button class="voice-button" id="voice-button">
                        <i class="fas fa-microphone"></i>
                    </button>
                </div>
            </div>
            
            <div class="voice-status" id="voice-status">
                <p class="status-text">Tap to speak</p>
                <p class="status-subtext">or type a command below</p>
            </div>
        </div>

        <!-- Text Input -->
        <div class="text-input-section">
            <div class="input-container">
                <input type="text" id="text-input" placeholder="Type a command..." class="text-input">
                <button class="send-button" id="send-button">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- Quick Commands -->
        <div class="quick-commands">
            <h3 class="section-title">Quick Commands</h3>
            <div class="command-grid">
                <button class="command-card" data-command="open chrome">
                    <i class="fab fa-chrome"></i>
                    <span>Chrome</span>
                </button>
                <button class="command-card" data-command="what time is it">
                    <i class="fas fa-clock"></i>
                    <span>Time</span>
                </button>
                <button class="command-card" data-command="take screenshot">
                    <i class="fas fa-camera"></i>
                    <span>Screenshot</span>
                </button>
                <button class="command-card" data-command="system info">
                    <i class="fas fa-desktop"></i>
                    <span>System</span>
                </button>
                <button class="command-card" data-command="go to youtube">
                    <i class="fab fa-youtube"></i>
                    <span>YouTube</span>
                </button>
                <button class="command-card" data-command="search downloads">
                    <i class="fas fa-search"></i>
                    <span>Search</span>
                </button>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="recent-activity">
            <div class="section-header">
                <h3 class="section-title">Recent Activity</h3>
                <button class="clear-btn" id="clear-activity">Clear</button>
            </div>
            <div class="activity-list" id="activity-list">
                <div class="activity-item system">
                    <i class="fas fa-circle-notch fa-spin"></i>
                    <div class="activity-content">
                        <span class="activity-text">Connecting to JARVIS...</span>
                        <span class="activity-time">Just now</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-view="home">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </button>
            <button class="nav-btn" data-view="history">
                <i class="fas fa-history"></i>
                <span>History</span>
            </button>
            <button class="nav-btn" data-view="dashboard">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </button>
            <button class="nav-btn" data-view="settings">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </button>
        </nav>
    </div>

    <!-- Response Modal -->
    <div class="response-modal" id="response-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>JARVIS Response</h3>
                <button class="close-btn" id="close-modal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body" id="modal-body">
                <p>Processing your command...</p>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Settings</h2>
                <button class="close-btn" id="close-settings">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="settings-body">
                <div class="setting-group">
                    <label>Server Address</label>
                    <input type="text" id="server-address" value="localhost:8765" placeholder="localhost:8765">
                </div>
                <div class="setting-group">
                    <label>Voice Language</label>
                    <select id="voice-language">
                        <option value="en-US">English (US)</option>
                        <option value="en-GB">English (UK)</option>
                        <option value="es-ES">Spanish</option>
                        <option value="fr-FR">French</option>
                        <option value="de-DE">German</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label>Auto-speak Responses</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="auto-speak" checked>
                        <span class="toggle-slider"></span>
                    </div>
                </div>
                <div class="setting-group">
                    <label>Vibration Feedback</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="vibration" checked>
                        <span class="toggle-slider"></span>
                    </div>
                </div>
                <button class="btn-primary btn-block" id="save-settings">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="js/mobile.js"></script>
</body>
</html>
