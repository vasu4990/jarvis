; PlatformIO Project Configuration for Advanced JARVIS MCU

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = direct

; Build settings
board_build.flash_mode = qio
board_build.partitions = huge_app.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

; Enable PSRAM
board_build.arduino.memory_type = qio_opi
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS

; Dependencies
lib_deps = 
    ; JSON
    bblanchon/ArduinoJson@^6.21.3
    
    ; LEDs
    fastled/FastLED@^3.6.0
    
    ; Display
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit SSD1306@^2.5.9
    
    ; Sensors
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit APDS9960 Library@^1.2.6
    adafruit/DHT sensor library@^1.4.6
    pololu/VL53L0X@^1.3.1
    
    ; I2S Audio
    https://github.com/pschatzmann/arduino-audio-tools.git
    
    ; MQTT
    knolleary/PubSubClient@^2.8
    
    ; TensorFlow Lite
    https://github.com/tensorflow/tflite-micro-arduino-examples.git
    
    ; Servo
    madhephaestus/ESP32Servo@^1.2.0
    
    ; WiFi Manager
    tzapu/WiFiManager@^2.0.16-rc.2

; Upload settings
upload_speed = 921600
upload_port = COM3  ; Change to your port

; Filesystem
board_build.filesystem = littlefs
