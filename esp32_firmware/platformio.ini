; PlatformIO Project Configuration for JARVIS ESP32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = direct

; Dependencies
lib_deps = 
    ; JSON library
    bblanchon/ArduinoJson@^6.21.3
    ; FastLED for NeoPixel control
    fastled/FastLED@^3.6.0

; Build flags
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ARDUHAL_LOG_COLORS

; Upload settings
upload_speed = 921600
